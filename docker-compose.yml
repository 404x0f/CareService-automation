services:
  postgres:
    image: postgres:16-alpine
    container_name: careservice-postgres
    environment:
      POSTGRES_DB: careservice
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careservice"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: careservice-app
    command: .venv/bin/uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs

  worker:
    build: .
    container_name: careservice-worker
    command: .venv/bin/python -m src.worker
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs

  bot:
    build: .
    restart: unless-stopped
    command: uv run python -m src.bot.main
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file:
      - .env

volumes:
  postgres_data:

