[project]
name = "fastapi-app"
version = "0.1.0"
description = "FastAPI application"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "httpx>=0.28.1",
    "greenlet>=3.5.5",
    "openai>=3.8.0",
    "asyncio>=4.0.0",
    "aiogram>=3.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
