[project]
name = "fastapi-app"
version = "0.1.0"
description = "FastAPI application"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "asyncpg",
    "alembic",
    "pydantic",
    "pydantic-settings",
    "httpx>=0.28.1",
    "greenlet>=3.5.5",
    "openai>=3.8.0",
    "asyncio>=4.0.0",
    "aiogram>=3.31.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = 'py312'
line-length = 88

[tool.ruff.lint]
select = ['E', 'F', 'I']
ignore = ['E501']

[tool.ruff.lint.isort]
known-first-party = ['apps', 'common']

[tool.ruff.format]
quote-style = 'single'